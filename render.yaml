# Render Blueprint for the EDAgent API (FastAPI). The research website is static (web/) and does
# not need this service. Free plan: 512 MB RAM, sleeps after 15 min idle — see docs/DEPLOYMENT.md.
# AI chat is OFF in this blueprint (no ANTHROPIC_API_KEY). Add the key later in the dashboard to enable it.
services:
  - type: web
    name: crashcross-edagent-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # Exactly one worker: sessions live in this process's memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false          # your Vercel production URL, e.g. https://crashcross.vercel.app
      - key: ALLOW_BYOK
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_SESSIONS
        value: "8"
      - key: SESSION_MEMORY_BUDGET_MB
        value: "240"
      - key: SESSION_TTL_MINUTES
        value: "60"
